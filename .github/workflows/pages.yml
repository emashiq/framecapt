# Deploys the website in website/ to GitHub Pages. The download links point at the newest
# published release: releases.json is regenerated on every deploy, and a deploy runs whenever a
# release is published or edited, so the site follows new releases without a commit.
#
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/scripts/pages-releases.mjs'
      - '.github/workflows/pages.yml'
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Resolve the newest download links
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/pages-releases.mjs website
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
