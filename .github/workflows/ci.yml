# Build Windows and Linux packages on pushes and pull requests to main.
# Artifacts are kept for 14 days; this workflow does not publish releases.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  package:
    name: Windows - installer + zip
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Cache FFmpeg
        uses: actions/cache@v6
        with:
          path: apps/desktop/vendor/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('apps/desktop/scripts/fetch-ffmpeg.mjs') }}
      # premake fetches and verifies the pinned FFmpeg build.
      - run: npm run make:desktop
      - uses: actions/upload-artifact@v7
        with:
          name: framecapt-windows-unsigned
          path: apps/desktop/out/make/
          retention-days: 14
          if-no-files-found: error

  linux:
    name: Linux (experimental) - deb + AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot dpkg squashfs-tools
      - run: npm ci
      - name: Cache FFmpeg
        uses: actions/cache@v6
        with:
          path: apps/desktop/vendor/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('apps/desktop/scripts/fetch-ffmpeg.mjs') }}
      # premake fetches and verifies FFmpeg and the pinned AppImage runtime.
      - run: npm run make:desktop
      - uses: actions/upload-artifact@v7
        with:
          name: framecapt-linux-experimental-unsigned
          path: apps/desktop/out/make/
          retention-days: 14
          if-no-files-found: error
